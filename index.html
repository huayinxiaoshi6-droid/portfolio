<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ポートフォリオ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      scroll-behavior: smooth;
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    /* ホーム */
    #home {
      height: 100vh;
      background: linear-gradient(to right, #f681bd, #ffebf5);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #home h1 {
      font-size: 3em;
    }

    /* ナビ */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      padding: 10px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
    }

    /* 自己紹介 */
    .profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      max-width: 800px;
      margin: auto;
    }

    /* 左（画像） */
    .profile-left img {
      width: 180px;
      border-radius: 50%;
    }

    /* 右（テキスト） */
    .profile-right {
      text-align: left;
    }

    .profile-right p {
      margin: 10px 0;
    }

    /* 作品 */
    .works {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 250px));
      gap: 20px;
      justify-content: center;
    }

    .work {
      border: 1px solid #ccc;
      padding: 10px;
      cursor: pointer;
    }

    .work-card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .work-card img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* スキル */
    .skills {
      max-width: 500px; 
      margin: 0 auto;
      text-align: center;
    }

    .skills h2 {
      margin-bottom: 30px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px 80px;
      justify-items: center;
    }

    .skill {
      text-align: center;
      padding: 10px;
      transition: 0.3s;
    }
    
    .skill:hover {
      transform: translateY(-5px);
    }
    .skill p {
      margin-bottom: 5px;
      font-weight: bold;
    }

    .stars {
      color: #f5a9d0;
      font-size: 18px;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      max-width: 500px;
    }

    .close {
      cursor: pointer;
      color: red;
    }
  </style>
</head>
<body>

<!-- ナビ -->
<nav>
  <a href="#home">ホーム</a>
  <a href="#about">自己紹介</a>
  <a href="#works">作品</a>
</nav>

<!-- ホーム -->
<section id="home">
  <h1>My Portfolio</h1>
  <p>ようこそ</p>
</section>

<!-- 自己紹介 -->
<section id="about">
  <h2>自己紹介</h2>

  <div class="profile">
    <!-- 左：画像 -->
    <div class="profile-left">
      <img src="sin.png" alt="プロフィール画像">
    </div>

    <!-- 右：テキスト -->
    <div class="profile-right">
      <p><strong>名前：</strong>小室　花音</p>
      <p><strong>生年月日：</strong>2006年12月7日</p>
      <p><strong>趣味：</strong>日記をつける・イラスト制作</p>
      <p><strong>好きなもの：</strong>名探偵コナン・ロリィタ</p>
      <p><strong>目標：</strong>相手の意図を汲み取り、形にできるWebデザイナー・エンジニアになる</p>
    </div>
  </div>
</section>

<!--作品紹介 -->
<section id="works">
  <h2>作品紹介</h2>

  <div class="works">
    <div class="work-card hover-up">
        <!-- onclick="openModal('作品1', '')"-->
      <img src="panf.png" alt="作品1">
      <h3>作品1</h3>
    </div>

    <div class="work-card hover-up">
      <img src="bag.png" alt="作品2">
      <h3>作品2</h3>
    </div>

    <div class="work-card hover-up">
      <img src="hato.png" alt="作品3">
      <h3>作品3</h3>
    </div>

    <div class="work-card hover-up">
      <img src="mori.png" alt="作品4">
      <h3>作品4</h3>
    </div>

     <div class="work-card hover-up">
      <img src="bingo.png" alt="作品5">
      <h3>作品5</h3>
    </div>
  </div>
</section>

<!--スキル -->
<section class="skills">
  <h2>スキル</h2>

  <div class="skills-grid">
    <div class="skill">
      <p>HTML</p>
      <div class="stars">★★★★☆</div>
    </div>

    <div class="skill">
      <p>CSS</p>
      <div class="stars">★★★★☆</div>
    </div>

    <div class="skill">
      <p>JavaScript</p>
      <div class="stars">★☆☆☆☆</div>
    </div>

    <div class="skill">
      <p>Photoshop</p>
      <div class="stars">★★★★☆</div>
    </div>

    <div class="skill">
      <p>Illustrator</p>
      <div class="stars">★★★☆☆</div>
    </div>

    <div class="skill">
      <p>Java</p>
      <div class="stars">★★★☆☆</div>
    </div>

    <div class="skill">
      <p>ibisPaint X</p>
      <div class="stars">★★★★★</div>
    </div>
  </div>
</section>

<!-- モーダル -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">閉じる</span>
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
  </div>
</div>

<script>
function openModal(title, text) {
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-text').innerText = text;
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>

</body>
</html>
